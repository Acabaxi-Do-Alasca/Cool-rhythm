<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cool Rhythm: ouça artistas, playlists e lançamentos, curta músicas e monte suas playlists.">
    <meta name="theme-color" content="#070707">
    <title>Cool Rhythm</title>
    <link rel="icon" href="../img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../styles/tokens.css">
    <link rel="stylesheet" href="../styles/base.css">
    <link rel="stylesheet" href="../styles/layout.css">
    <link rel="stylesheet" href="../styles/componentes.css">
    <link rel="stylesheet" href="../styles/player.css">
</head>
<body>
    <a class="pular-conteudo" href="#conteudo" data-pular>Pular para o conteúdo</a>

    <div class="app">
        <!-- Montado pelo js/layout.js -->
        <aside class="menu-lateral" id="menu-lateral"></aside>

        <div class="area" id="area">
            <header class="topo">
                <a class="topo-marca" href="#/"><img src="../img/logo.png" alt="Cool Rhythm, início"></a>
                <div class="topo-espaco"></div>
                <button class="botao botao-texto" type="button" data-em-breve="O cadastro">Inscrever-se</button>
                <button class="botao botao-claro" type="button" data-em-breve="O login">Entrar</button>
            </header>
            <!-- Cada rota (#/, #/buscar, #/playlist/rap...) é desenhada aqui pelo js/paginas.js -->
            <main id="conteudo" tabindex="-1"></main>
        </div>

        <!-- Montado pelo js/player.js -->
        <footer class="player" id="player" aria-label="Player"></footer>

        <nav class="nav-celular" id="nav-celular" aria-label="Navegação principal"></nav>
    </div>

    <dialog class="dialogo" id="dialogo"></dialog>
    <div class="avisos" id="avisos" aria-live="polite"></div>

    <script src="../js/util.js"></script>
    <script src="../js/icones.js"></script>
    <script src="../js/catalogo.js"></script>
    <script src="../js/estado.js"></script>
    <script src="../js/sintetizador.js"></script>
    <script src="../js/player.js"></script>
    <script src="../js/componentes.js"></script>
    <script src="../js/paginas.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
